---
layout: default
---

<h1>Posts tagged “{{ page.tag }}”</h1>

<ul>
{% for post in site.tags[page.tag] %}
  <li>
    <a href="{{ post.url }}">{{ post.title }}</a>
    <span class="post-date">{{ post.date | date_to_string }}</span>
  </li>
{% endfor %}
</ul>

<p><a href="/tags/">Browse all tags</a></p>
