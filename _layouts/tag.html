---
layout: default
---

<h1>Posts tagged “{{ page.tag }}”</h1>

{% assign tagged_posts = site.tags[page.tag] %}

<div class="posts">
  {% for post in tagged_posts %}
    <div class="post">
      <h1 class="post-title">
        <a href="{{ post.url }}">
          {{ post.title }}
        </a>
      </h1>

      <span class="post-date">{{ post.date | date_to_string }}</span>

      {{ post.content }}
    </div>
  {% endfor %}
</div>

<p><a href="/tag/">Browse all tags</a></p>
